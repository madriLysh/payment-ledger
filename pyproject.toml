[project]
name = "payment-ledger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "madriLysh", email = "akhan0106@stu.kau.edu.sa" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.0",
    "testcontainers>=4.15.0",
    "uuid-utils>=1.0.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
payment-ledger = "payment_ledger:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "testcontainers[postgres]>=4.15.0",
]
